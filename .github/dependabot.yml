# Weekly pull requests for dependency updates: Gradle (libs.versions.toml, plugins) and the
# GitHub Actions used by the workflows. Related updates come grouped in one PR.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Kotlin follows the version bundled with Android Studio (a mismatch breaks the IDE's
      # Compose support): bump it by hand when Studio updates.
      - dependency-name: "org.jetbrains.kotlin*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # The Android Gradle Plugin needs a matching Gradle wrapper (and Android Studio), which
      # Dependabot can't update: bump them together by hand.
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # These need compileSdk 37 (see libs.versions.toml); the app compiles against 36.
      - dependency-name: "androidx.core:core-ktx"
        versions: [">= 1.19.0"]
      - dependency-name: "androidx.navigation:navigation-compose"
        versions: [">= 2.10.0"]
      - dependency-name: "androidx.compose:compose-bom"
        versions: [">= 2026.07.00"]
    groups:
      androidx-compose:
        patterns: ["androidx.compose*", "androidx.activity*", "androidx.lifecycle*", "androidx.navigation*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "com.google.devtools.ksp*", "org.jetbrains.kotlinx*"]
      mlkit:
        patterns: ["com.google.mlkit*", "com.google.android.gms*"]
      code-checks:
        patterns: ["dev.detekt*", "io.nlopez.compose.rules*", "org.jetbrains.kotlinx.kover*", "com.joetr.compose.guard*"]
      testing:
        patterns: ["junit*", "org.robolectric*", "app.cash.turbine*", "androidx.test*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
