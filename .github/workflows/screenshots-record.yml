# Records the screenshot goldens (#50) on CI's OS, so fonts render the same as in the comparison
# that Android CI runs, and uploads them. Run it from the Actions tab on the branch whose screens
# changed on purpose, download "screenshots", put the images in app/src/test/screenshots and
# commit them. It never commits by itself: commits stay yours (and signed).
name: Record screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    name: Record screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      # Only the screenshot tests; the old images are cleared first so removed previews go too.
      - name: Record
        run: |
          rm -rf app/src/test/screenshots
          ./gradlew :app:recordRoborazziDebug --tests "*RoborazziPreviewParameterizedTests*" --stacktrace

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: app/src/test/screenshots/
          retention-days: 7
