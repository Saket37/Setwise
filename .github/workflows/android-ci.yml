# Builds the app and runs the unit tests with coverage on every pull request (and on main after
# a merge). The ruleset on main requires the "Build and unit tests" job to pass before a PR can
# be merged. Code checks (Android Lint, detekt, Compose stability) are in code-quality.yml.
name: Android CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR cancels the run that's still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only: the workflow only checks code. (Pull requests from forks get no secrets anyway.)
permissions:
  contents: read

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # Same JDK the project compiles for.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Caches Gradle downloads and build outputs between runs; validates the Gradle wrapper.
      - uses: gradle/actions/setup-gradle@v6

      # Debug build, JVM unit tests (Compose recomposition tests included, on Robolectric), and
      # line coverage (Kover), which fails under the minimum set in app/build.gradle.kts.
      # Instrumented tests (androidTest) need an emulator and are run locally for now (#37).
      - name: Build, test and check coverage
        run: ./gradlew assembleDebug testDebugUnitTest koverXmlReportDebug koverHtmlReportDebug koverVerifyDebug --stacktrace

      # Coverage per package on the run's summary page.
      - name: Coverage summary
        if: always()
        run: python3 .github/scripts/coverage_summary.py app/build/reports/kover/reportDebug.xml >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: app/build/reports/kover/htmlDebug/
          retention-days: 7

      # When something fails, the test reports are downloadable from the run's summary page.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7
