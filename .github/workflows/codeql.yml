# CodeQL security analysis of the Kotlin code (java-kotlin): unsafe intent handling, paths or
# queries built from untrusted input, data from shared intents and files reaching sensitive
# APIs. Findings go to GitHub code scanning, next to Lint's and detekt's.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  # Weekly, so new queries also run over code that hasn't changed.
  schedule:
    - cron: "17 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (Kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6

      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          # CodeQL reads the code as the compiler sees it, so it watches a real build.
          build-mode: manual
          queries: security-extended

      # Every compile task must actually run for CodeQL to see it: no up-to-date or cached tasks.
      - name: Build
        run: ./gradlew assembleDebug --no-build-cache --rerun-tasks --no-daemon --stacktrace

      - uses: github/codeql-action/analyze@v4
        with:
          category: codeql-kotlin
