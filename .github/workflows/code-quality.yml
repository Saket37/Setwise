# Code checks on every pull request (and on main after a merge), in parallel jobs:
#  - Android Lint: Android-specific problems (API levels, resources, accessibility, security).
#  - Kotlin checks: detekt with the Compose rules and ktlint formatting (config/detekt/).
#  - Compose stability: Compose Guard fails when a composable stops being skippable or gains
#    unstable parameters, compared with the golden reports in app/compose_reports/.
# Lint and detekt findings also go to GitHub code scanning, so they show on the PR's lines.
name: Code quality

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Upload the findings to code scanning.
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6

      # Fails only on errors, not warnings; warnings still show in code scanning.
      - name: Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload findings to code scanning
        if: always() && hashFiles('app/build/reports/lint-results-debug.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: app/build/reports/lint-results-debug.sarif
          category: android-lint

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 7

  detekt:
    name: Kotlin checks (detekt)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6

      # App, unit-test and instrumented-test sources, with type resolution. Findings in the
      # baselines (app/detekt-baseline-*.xml) are known and tracked in #42; new ones fail.
      - name: detekt
        run: ./gradlew detektDebug detektDebugUnitTest detektDebugAndroidTest --continue --stacktrace

      - name: Upload findings to code scanning
        if: always() && hashFiles('app/build/reports/detekt/debug.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: app/build/reports/detekt/
          category: detekt

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: detekt-report
          path: app/build/reports/detekt/*.html
          retention-days: 7

  compose-stability:
    name: Compose stability
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6

      # Compares the Compose compiler's reports with app/compose_reports/. After an intended
      # change, regenerate them: ./gradlew debugComposeCompilerGenerate
      - name: Compose Guard
        run: ./gradlew debugComposeCompilerCheck --stacktrace
